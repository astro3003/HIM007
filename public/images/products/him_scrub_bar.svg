<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2A2A32" />
      <stop offset="45%" stop-color="#141418" />
      <stop offset="100%" stop-color="#08080A" />
    </radialGradient>
    
    <!-- Volcanic Stone Gradient -->
    <linearGradient id="volcanicRock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E22" />
      <stop offset="25%" stop-color="#121214" />
      <stop offset="50%" stop-color="#25252A" />
      <stop offset="75%" stop-color="#0D0D0F" />
      <stop offset="100%" stop-color="#18181C" />
    </linearGradient>

    <!-- Box Front Face (Matte Black) -->
    <linearGradient id="frontBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242426" />
      <stop offset="40%" stop-color="#1A1A1C" />
      <stop offset="100%" stop-color="#121213" />
    </linearGradient>

    <!-- Box Side Face (Burnt Coral / Terracotta Orange) -->
    <linearGradient id="sideOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A36" />
      <stop offset="30%" stop-color="#E84A26" />
      <stop offset="70%" stop-color="#D03D1B" />
      <stop offset="100%" stop-color="#A82E12" />
    </linearGradient>

    <!-- Box Top Face -->
    <linearGradient id="topBoxGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2C2C30" />
      <stop offset="100%" stop-color="#3A3A40" />
    </linearGradient>

    <!-- Mist / Steam Glow -->
    <filter id="mistBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
    
    <!-- Subtle Drop Shadow -->
    <filter id="boxShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <!-- Droplet Glint -->
    <radialGradient id="glint" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Studio Background with Steam / Locker Room Atmosphere -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />

  <!-- Atmospheric Steam in Background -->
  <ellipse cx="250" cy="400" rx="200" ry="350" fill="#40404C" opacity="0.18" filter="url(#mistBlur)" />
  <ellipse cx="580" cy="360" rx="220" ry="320" fill="#4E4E5C" opacity="0.22" filter="url(#mistBlur)" />
  <ellipse cx="400" cy="220" rx="260" ry="180" fill="#5A5A6A" opacity="0.15" filter="url(#mistBlur)" />

  <!-- Wet Volcanic Rock Base (Ground Pedestal) -->
  <g id="volcanicPedestal">
    <path d="M 40 820 Q 180 760 380 770 Q 600 750 760 810 L 800 1000 L 0 1000 Z" fill="url(#volcanicRock)" />
    <!-- Rock Highlights & Wet Texture -->
    <path d="M 120 800 Q 280 770 420 780 Q 560 765 700 800" stroke="#454550" stroke-width="4" fill="none" opacity="0.6" />
    <path d="M 60 840 Q 220 810 380 825 Q 540 805 740 850" stroke="#32323A" stroke-width="3" fill="none" opacity="0.5" />
    <ellipse cx="380" cy="810" rx="25" ry="8" fill="url(#glint)" opacity="0.4" />
    <ellipse cx="540" cy="790" rx="35" ry="10" fill="url(#glint)" opacity="0.35" />
    <ellipse cx="240" cy="820" rx="18" ry="6" fill="url(#glint)" opacity="0.5" />
    <ellipse cx="650" cy="830" rx="28" ry="9" fill="url(#glint)" opacity="0.4" />
  </g>

  <!-- 3D Packaging Box Group -->
  <g id="scrubBox" filter="url(#boxShadow)">
    <!-- 1. Top Face of Box (Perspective trapezoid) -->
    <polygon points="210,210 290,185 640,198 560,225" fill="url(#topBoxGrad)" />
    
    <!-- 2. Left / Side Panel of Box (Burnt Terracotta Orange) -->
    <!-- Perspective polygon from left edge -->
    <polygon points="210,210 290,185 290,780 210,795" fill="url(#sideOrangeGrad)" />

    <!-- Side Panel Details & Typography -->
    <g transform="translate(215, 205)">
      <!-- Top Subtitles on Side Panel -->
      <text x="35" y="40" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" letter-spacing="1" text-anchor="middle">REVITALIZING</text>
      <text x="35" y="55" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" letter-spacing="1" text-anchor="middle">EXFOLIANT BAR</text>
      <line x1="8" y1="64" x2="62" y2="64" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7" />
      <text x="35" y="74" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.5" text-anchor="middle">CONCENTRATED FORMULA</text>

      <!-- Water Droplets on Orange Side Panel -->
      <circle cx="25" cy="140" r="3.5" fill="#FFFFFF" opacity="0.7" />
      <circle cx="50" cy="135" r="2" fill="#FFFFFF" opacity="0.6" />
      <circle cx="32" cy="180" r="4.5" fill="#FFFFFF" opacity="0.8" />
      <ellipse cx="48" cy="225" rx="3" ry="5" fill="#FFFFFF" opacity="0.75" />
      <circle cx="20" cy="360" r="3" fill="#FFFFFF" opacity="0.6" />
      <circle cx="45" cy="390" r="4" fill="#FFFFFF" opacity="0.7" />
      <circle cx="30" cy="425" r="2.5" fill="#FFFFFF" opacity="0.8" />

      <!-- him Logo on Side Panel -->
      <text x="35" y="275" font-family="'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5" text-anchor="middle">him</text>
      <text x="35" y="295" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" letter-spacing="1.5" text-anchor="middle">DEFINE YOUR</text>
      <text x="35" y="307" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" letter-spacing="1.5" text-anchor="middle">RECOVERY.</text>

      <!-- Bottom Tag on Side Panel -->
      <text x="35" y="475" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="900" fill="#FFFFFF" letter-spacing="0.5" text-anchor="middle">MASTER</text>
      <text x="35" y="490" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="900" fill="#FFFFFF" letter-spacing="0.5" text-anchor="middle">FORMULATION</text>
      <line x1="8" y1="498" x2="62" y2="498" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7" />
      <text x="35" y="508" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" font-weight="700" fill="#FFFFFF" letter-spacing="0.5" text-anchor="middle">CONCENTRATED FORMULA</text>
    </g>

    <!-- 3. Front Face of Box (Matte Charcoal Black) -->
    <polygon points="290,185 640,198 640,795 290,780" fill="url(#frontBoxGrad)" stroke="#2C2C30" stroke-width="0.8" />

    <!-- Front Face Edge Sheen -->
    <line x1="290" y1="185" x2="290" y2="780" stroke="#FF5A36" stroke-width="1.5" opacity="0.6" />

    <!-- Front Face Typography -->
    <g transform="translate(300, 200)">
      <!-- Giant HIM. Logo (Signature Bold Burnt Orange / Terracotta) -->
      <!-- Vertical Stack / Massive Display Type -->
      <g fill="#E84A26">
        <!-- H I M . -->
        <g transform="translate(35, 45)">
          <text x="0" y="100" font-family="'Arial Black', Impact, sans-serif" font-size="135" font-weight="900" letter-spacing="-4">H</text>
          <text x="0" y="215" font-family="'Arial Black', Impact, sans-serif" font-size="135" font-weight="900" letter-spacing="-4">I</text>
          <text x="0" y="335" font-family="'Arial Black', Impact, sans-serif" font-size="135" font-weight="900" letter-spacing="-4">M</text>
          <!-- Distinctive Dot -->
          <circle cx="150" cy="30" r="17" fill="#E84A26" />
        </g>
      </g>

      <!-- Bottom Headline on Front Face -->
      <g transform="translate(35, 410)">
        <text x="0" y="25" font-family="'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">MEN'S</text>
        <text x="0" y="53" font-family="'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">DEEP CLEANSE</text>
        <text x="0" y="81" font-family="'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">&amp; MUSCLE</text>
        <text x="0" y="109" font-family="'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">RECOVERY</text>
        <text x="0" y="137" font-family="'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">SCRUB BAR</text>
      </g>
    </g>
  </g>

  <!-- Rising Foreground Steam Mist -->
  <ellipse cx="220" cy="800" rx="140" ry="90" fill="#505060" opacity="0.25" filter="url(#mistBlur)" />
  <ellipse cx="580" cy="810" rx="160" ry="80" fill="#505060" opacity="0.25" filter="url(#mistBlur)" />
</svg>
